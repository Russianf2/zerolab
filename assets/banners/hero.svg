  <text x="720" y="360" text-anchor="middle" fill="rgba(255,255,255,0.03)" font-family="Inter, system-ui, sans-serif" font-size="200" font-weight="800" letter-spacing="0.05">ZERO LABEL</text>
  <text x="720" y="470" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="300" letter-spacing="12">NO RULES. JUST STYLE.</text>
