<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago — ZERO LABEL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
  <div class="page-loader" id="pageLoader"><div class="loader-spinner"></div></div>
  <nav class="navbar" id="navbar"></nav>
  <div class="mobile-menu" id="mobileMenu"></div>

  <div class="checkout-page container">
    <h1 style="font-size:1.5rem;font-weight:600;margin-bottom:32px">Pago</h1>
    <div class="checkout-layout" id="checkoutLayout">
      <form id="checkoutForm" onsubmit="return false;">
        <div class="checkout-form-section">
          <h2>Información de Contacto</h2>
          <div class="checkout-form-grid">
            <div class="form-group full-width">
              <label>Email</label>
              <input type="email" id="email" placeholder="ramosgiorgios43@gmail.com" required>
              <span class="error-text">Requerido</span>
            </div>
          </div>
        </div>

        <div class="checkout-form-section" style="margin-top:20px">
          <h2>Dirección de Envío</h2>
          <div class="checkout-form-grid">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" id="firstName" placeholder="Juan" required>
              <span class="error-text">Requerido</span>
            </div>
            <div class="form-group">
              <label>Apellido</label>
              <input type="text" id="lastName" placeholder="Pérez" required>
              <span class="error-text">Requerido</span>
            </div>
            <div class="form-group full-width">
              <label>Dirección</label>
              <input type="text" id="address" placeholder="Calle 123, Barrio" required>
              <span class="error-text">Requerido</span>
            </div>
            <div class="form-group">
              <label>Ciudad</label>
              <input type="text" id="city" placeholder="Bogotá" required>
              <span class="error-text">Requerido</span>
            </div>
            <div class="form-group">
              <label>País</label>
              <select id="country" required>
                <option value="">Seleccionar...</option>
                <option value="Colombia">Colombia</option>
                <option value="México">México</option>
                <option value="Argentina">Argentina</option>
                <option value="Chile">Chile</option>
                <option value="Perú">Perú</option>
                <option value="España">España</option>
                <option value="Estados Unidos">Estados Unidos</option>
              </select>
              <span class="error-text">Requerido</span>
            </div>
            <div class="form-group">
              <label>Teléfono</label>
              <input type="tel" id="phone" placeholder="+57 300 000 0000" required>
              <span class="error-text">Requerido</span>
            </div>
          </div>
        </div>

        <div class="checkout-form-section" style="margin-top:20px">
          <h2>Método de Pago</h2>
          <div class="payment-methods">
            <div class="payment-method active" onclick="selectPayment('visa')">
              <svg viewBox="0 0 48 16"><text x="0" y="14" font-size="14" font-weight="700" fill="currentColor">VISA</text></svg>
              <span>Visa</span>
            </div>
            <div class="payment-method" onclick="selectPayment('mastercard')">
              <svg viewBox="0 0 48 16"><text x="0" y="14" font-size="12" font-weight="700" fill="currentColor">MC</text></svg>
              <span>Mastercard</span>
            </div>
            <div class="payment-method" onclick="selectPayment('paypal')">
              <svg viewBox="0 0 48 16"><text x="0" y="14" font-size="11" font-weight="700" fill="currentColor">PayPal</text></svg>
              <span>PayPal</span>
            </div>
            <div class="payment-method" onclick="selectPayment('applepay')">
              <svg viewBox="0 0 48 16"><text x="0" y="14" font-size="10" font-weight="700" fill="currentColor">Apple Pay</text></svg>
              <span>Apple Pay</span>
            </div>
          </div>

          <div id="cardDetails">
            <div class="checkout-form-grid">
              <div class="form-group full-width">
                <label>Número de Tarjeta</label>
                <input type="text" id="cardNumber" placeholder="xxxx xxxx xxxx xxxx" maxlength="19">
                <span class="error-text">Requerido</span>
              </div>
              <div class="form-group">
                <label>Fecha de Vencimiento</label>
                <input type="text" id="expiry" placeholder="MM/AA" maxlength="5">
                <span class="error-text">Requerido</span>
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="text" id="cvv" placeholder="•••" maxlength="4">
                <span class="error-text">Requerido</span>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:24px" onclick="placeOrder()">
          Confirmar Pedido
        </button>
      </form>

      <div id="checkoutSummary"></div>
    </div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
